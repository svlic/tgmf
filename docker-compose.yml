services:
  web:
    build: .
    command: npm run start
    env_file:
      - .env
    ports:
      - "54001:3000"
    volumes:
      - ./data:/app/data
    depends_on:
      - worker

  worker:
    build: .
    command: npm run worker
    env_file:
      - .env
    environment:
      WORKER_ID: worker-main
    volumes:
      - ./data:/app/data
