services:
  web:
    image: ghcr.io/svlic/tgmf:${IMAGE_TAG:-latest}
    command: npm run start
    env_file:
      - .env
    ports:
      - "54001:3000"
    volumes:
      - ./data:/app/data

  worker:
    image: ghcr.io/svlic/tgmf:${IMAGE_TAG:-latest}
    command: npm run worker
    env_file:
      - .env
    environment:
      WORKER_ID: worker-main
    volumes:
      - ./data:/app/data
